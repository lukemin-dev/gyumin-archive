<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510"><rect width="900" height="510" fill="#fbfaf7"/><g font-family="Arial,sans-serif" fill="#202722"><text x="40" y="52" font-size="25" font-weight="bold">TCP: one message, multiple reads</text><text x="40" y="87" font-size="16" fill="#69716b">Illustrative payload · not a captured production log</text><text x="40" y="147" font-size="18">Send</text><rect x="180" y="115" width="150" height="56" fill="#17624f"/><text x="203" y="150" fill="white" font-size="18">Length = 5</text><rect x="330" y="115" width="400" height="56" fill="#e7efe9" stroke="#b6c9bd"/><text x="476" y="150" font-size="22" letter-spacing="10">HELLO</text><text x="40" y="240" font-size="18">Read #1</text><rect x="180" y="207" width="150" height="56" fill="#17624f"/><text x="203" y="242" fill="white" font-size="18">Length = 5</text><rect x="330" y="207" width="160" height="56" fill="#e7efe9" stroke="#b6c9bd"/><text x="380" y="243" font-size="22" letter-spacing="10">HE</text><text x="520" y="243" font-size="16">2 / 5 bytes → keep waiting</text><text x="40" y="330" font-size="18">Read #2</text><rect x="490" y="297" width="240" height="56" fill="#e7efe9" stroke="#b6c9bd"/><text x="562" y="332" font-size="22" letter-spacing="10">LLO</text><path d="M180 395 H800" stroke="#d8d2c7"/><text x="180" y="435" font-size="20" fill="#17624f">Buffer: HE + LLO = HELLO</text><text x="180" y="469" font-size="17">Process only after the full payload is received.</text></g></svg>
